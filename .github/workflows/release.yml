name: Release Desktop

on:
  push:
    tags:
      - 'v*'
    # Dry run: builds every platform but publishes nothing — the installers
    # come back as run artifacts (see the last step). For trying out
    # packaging changes without a release.
    branches:
      - 'mac/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      # One platform at a time. Each tauri-action run reads latest.json back
      # from the release, adds its own platform and re-uploads it; two running
      # at once and whichever finishes last drops the other's entry.
      max-parallel: 1
      matrix:
        include:
          - name: windows
            platform: windows-latest
            # NSIS only — WiX/MSI bundling fails when fileAssociations are
            # declared (Tauri 2 known issue); NSIS is the recommended installer
            # and what latest.json points at via updaterJsonPreferNsis.
            args: '--bundles nsis,updater'
          # macOS: one build per arch (darwin-aarch64 / darwin-x86_64 in
          # latest.json; tauri-action suffixes the .app.tar.gz with the arch so
          # the two don't collide). Intel is cross-compiled on the arm64
          # runner. No Apple certificate: the app is ad-hoc signed
          # (bundle.macOS.signingIdentity "-") and users clear Gatekeeper
          # themselves — see README. The `app` bundle is what produces the
          # updater's .app.tar.gz.
          - name: mac-arm
            platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - name: mac-intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci --no-audit --no-fund

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull lines between "## VERSION" and the next "## "
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if ($0 ~ "^## " ver "([^0-9]|$)") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.txt
          {
            echo "notes<<EOF"
            cat release-notes.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty off a tag: tauri-action then only builds. A branch dispatch
          # used to pass the branch name here and try to publish a release
          # called "desktop".
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

      - name: Upload installers (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: autobook-${{ matrix.name }}
          # `--target` builds land under target/<triple>/release.
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/nsis/*.exe*
          if-no-files-found: error
