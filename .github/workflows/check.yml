name: Check

on:
  # Only main on push: a branch with an open PR would otherwise run everything
  # twice, once for the push and once for the pull_request event.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: svelte-check
        run: npm run check

      - name: Self-tests (sanitizer, spoiler cutoff)
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust compiles
    # The Tauri crate pulls in Windows-only APIs (WinRT speech, explorer.exe),
    # so this only compiles on the same platform we ship.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
