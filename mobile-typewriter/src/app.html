<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#5f7e7b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AutoBook" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
    <!-- iOS picks the apple-touch-icon link closest to its target tile
         size (180×180 on iPhone/iPad). The icons here are now full-bleed
         opaque squares — previously the round-on-transparent PNG let
         Apple's squircle mask paint black wedges in the corners. The
         dedicated 180×180 file is sized for iOS specifically; 192/512
         stay listed as a fallback for older versions. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
