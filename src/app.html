<!DOCTYPE html>
<html class="writing-horizontal-tb h-full w-full" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1"
      name="viewport"
    />
    <link rel="icon" type="image/png" sizes="152x152" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/icons/regular-icon@32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%sveltekit.assets%/icons/regular-icon@16x16.png"
    />
    <meta name="theme-color" content="#5f7e7b" />
    %sveltekit.head%
  </head>
  <body class="h-full w-full break-words font-sans">
    <div class="h-full w-full">%sveltekit.body%</div>
  </body>
</html>
